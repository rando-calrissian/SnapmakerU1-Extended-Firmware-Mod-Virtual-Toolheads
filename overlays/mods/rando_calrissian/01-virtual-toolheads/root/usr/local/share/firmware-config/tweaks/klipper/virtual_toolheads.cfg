# Virtual toolheads: calibration and nozzle data follow the physical toolhead
# instead of the slot it is plugged into.  See the overlay README.

[virtual_toolheads]
# What to do at print start if a loaded toolhead needs calibration:
# off, warn, block
print_guard: warn
# While the calibration wizard runs, reject stock calibration commands sent by
# other clients (the touchscreen app continues its own flow when it sees the
# calibration state). Set to False to disable this protection.
# guard_calibration: True
# Optional: override where the data file lives (default: persistent/virtual_toolheads.json)
# store_path: /home/lava/printer_data/config/persistent/virtual_toolheads.json

# Called automatically by PRINT_START through the klipper-hooks overlay.
[gcode_macro _PRINT_START_VT_CHECK]
description: Warn or block if a loaded virtual toolhead needs calibration
gcode:
    VT_CHECK

# Buttons for the Fluidd/Mainsail "Macros" panel. They open dialogs; all state
# lives in the dialogs' own buttons, so nothing is kept between clicks.
[gcode_macro VT_MENU]
description: Virtual toolheads: overview, layout, nozzles, spares
gcode:
    VT_UI

[gcode_macro VT_LAYOUT_MENU]
description: Change which virtual toolhead is in each slot
gcode:
    VT_UI PAGE=layout

[gcode_macro VT_NOZZLE_MENU]
description: Change the nozzle on a virtual toolhead
gcode:
    VT_UI PAGE=nozzle

[gcode_macro VT_CALIBRATE_MENU]
description: Calibrate only the loaded toolheads that need it
gcode:
    VT_CALIBRATE
